 data-participant-1="Customer" data-participant-2="Order"><polygon fill="#181818" points="412.8645,201.0156,422.8645,205.0156,412.8645,209.0156,416.8645,205.0156" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="65.1741" x2="418.8645" y1="205.0156" y2="205.0156"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="72.1741" y="200.1592">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.4243" x="83.4041" y="200.1592">createPreOrder(reservationId, readyAt)</text></g><g class="message" data-participant-1="Order" data-participant-2="Customer"><polygon fill="#181818" points="76.1741,231.3672,66.1741,235.3672,76.1741,239.3672,72.1741,235.3672" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="70.1741" x2="423.8645" y1="235.3672" y2="235.3672"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="82.1741" y="230.5107">2</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.4604" x="93.4041" y="230.5107">DRAFT + order reference + proposed checkout deadline</text></g><path d="M24,250.3672 L96.4346,250.3672 L96.4346,258.7188 L86.4346,268.7188 L24,268.7188 L24,250.3672" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="80.4063" style="stroke:#000000;stroke-width:1.5;" width="456.1536" x="24" y="250.3672"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="27.4346" x="39" y="264.8623">loop</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="125.709" x="111.4346" y="265.8623">[Each selected dish]</text><g class="message" data-participant-1="Customer" data-participant-2="Order"><polygon fill="#181818" points="412.8645,288.4219,422.8645,292.4219,412.8645,296.4219,416.8645,292.4219" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="65.1741" x2="418.8645" y1="292.4219" y2="292.4219"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="72.1741" y="287.5654">3</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.2007" x="83.4041" y="287.5654">addItem(orderId, itemId, quantity)</text></g><g class="message" data-participant-1="Order" data-participant-2="Customer"><polygon fill="#181818" points="76.1741,318.7734,66.1741,322.7734,76.1741,326.7734,72.1741,322.7734" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="70.1741" x2="423.8645" y1="322.7734" y2="322.7734"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="82.1741" y="317.917">4</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.7725" x="93.4041" y="317.917">item accepted / input or availability error</text></g><g class="message" data-participant-1="Customer" data-participant-2="Order"><polygon fill="#181818" points="412.8645,356.125,422.8645,360.125,412.8645,364.125,416.8645,360.125" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="65.1741" x2="418.8645" y1="360.125" y2="360.125"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="72.1741" y="355.2686">5</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.3799" x="83.4041" y="355.2686">quote(orderId)</text></g><path d="M9,375.125 L69.1709,375.125 L69.1709,383.4766 L59.1709,393.4766 L9,393.4766 L9,375.125" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="480.0313" style="stroke:#000000;stroke-width:1.5;" width="665.4473" x="9" y="375.125"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.1709" x="24" y="389.6201">alt</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="236.1963" x="84.1709" y="390.6201">[Invalid or empty order / invalid quote]</text><g class="message" data-participant-1="Order" data-participant-2="Customer"><polygon fill="#181818" points="76.1741,413.1797,66.1741,417.1797,76.1741,421.1797,72.1741,417.1797" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="70.1741" x2="423.8645" y1="417.1797" y2="417.1797"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="82.1741" y="412.3232">6</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.4771" x="93.4041" y="412.3232">correct draft; no payment attempt</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="9" x2="674.4473" y1="426.1797" y2="426.1797"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="78.7173" x="14" y="439.6748">[Valid quote]</text><g class="message" data-participant-1="Order" data-participant-2="Customer"><polygon fill="#181818" points="76.1741,461.8828,66.1741,465.8828,76.1741,469.8828,72.1741,465.8828" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="70.1741" x2="423.8645" y1="465.8828" y2="465.8828"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="82.1741" y="461.0264">7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.7197" x="93.4041" y="461.0264">amount + currency + quote validity</text></g><path d="M19,480.8828 L79.1709,480.8828 L79.1709,489.2344 L69.1709,499.2344 L19,499.2344 L19,480.8828" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="367.2734" style="stroke:#000000;stroke-width:1.5;" width="645.4473" x="19" y="480.8828"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="15.1709" x="34" y="495.3779">alt</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="227.5381" x="94.1709" y="496.3779">[Customer confirms before deadline]</text><rect fill="none" height="59.0547" style="stroke:#000000;stroke-width:1.5;" width="442.1536" x="31" y="500.5859"/><path d="M31,500.5859 L92,500.5859 L92,508.5859 L82,518.5859 L31,518.5859 L31,500.5859" fill="#EEEEEE" style="stroke:#000000;stroke-width:2;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="16.6182" x="44" y="516.0811">ref</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.9033" x="138.6251" y="536.0811">Payment initiation and verified outcome</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.1016" x="167.526" y="552.4326">See payment-sequence.puml</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="19" x2="664.4473" y1="565.6406" y2="565.6406"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="281.0107" x="24" y="579.1357">[Customer explicitly cancels before initiation]</text><g class="message" data-participant-1="Customer" data-participant-2="Order"><polygon fill="#181818" points="412.8645,601.3438,422.8645,605.3438,412.8645,609.3438,416.8645,605.3438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="65.1741" x2="418.8645" y1="605.3438" y2="605.3438"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="72.1741" y="600.4873">8</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.6226" x="83.4041" y="600.4873">cancelUnpaid(orderId)</text></g><path d="M288,618.3438 L288,644.3438 L560,644.3438 L560,628.3438 L550,618.3438 L288,618.3438" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M550,618.3438 L550,628.3438 L560,628.3438 L550,618.3438" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.0815" x="294" y="636.8389">PreOrder = CANCELLED; Payment absent.</text><g class="message" data-participant-1="Order" data-participant-2="Customer"><polygon fill="#181818" points="76.1741,668.0469,66.1741,672.0469,76.1741,676.0469,72.1741,672.0469" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="70.1741" x2="423.8645" y1="672.0469" y2="672.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="7.23" x="82.1741" y="667.1904">9</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.4878" x="93.4041" y="667.1904">pre-order cancelled; reservation unchanged</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="19" x2="664.4473" y1="681.0469" y2="681.0469"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="233.3018" x="24" y="694.542">[Customer leaves without confirming]</text><path d="M29,703.3984 L29,729.3984 L460,729.3984 L460,713.3984 L450,703.3984 L29,703.3984" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M450,703.3984 L450,713.3984 L460,713.3984 L450,703.3984" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.3232" x="76.4152" y="721.8936">No confirmation message; this is not a rejected payment.</text><path d="M289,741.75 L354.2109,741.75 L354.2109,750.1016 L344.2109,760.1016 L289,760.1016 L289,741.75" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="99.4063" style="stroke:#000000;stroke-width:1.5;" width="365.4473" x="289" y="741.75"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.2109" x="304" y="756.2451">opt</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="280.2363" x="369.2109" y="757.2451">[Draft still unpaid at proposed finite deadline]</text><g class="message" data-participant-1="Order" data-participant-2="Order"><line style="stroke:#181818;stroke-width:1;" x1="424.8645" x2="466.8645" y1="783.8047" y2="783.8047"/><line style="stroke:#181818;stroke-width:1;" x1="466.8645" x2="466.8645" y1="783.8047" y2="796.8047"/><line style="stroke:#181818;stroke-width:1;" x1="425.8645" x2="466.8645" y1="796.8047" y2="796.8047"/><polygon fill="#181818" points="435.8645,792.8047,425.8645,796.8047,435.8645,800.8047,431.8645,796.8047" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="14.46" x="431.8645" y="778.9482">10</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.4517" x="450.3245" y="778.9482">expireUnpaid(orderId)</text></g><path d="M299,809.8047 L299,835.8047 L550,835.8047 L550,819.8047 L540,809.8047 L299,809.8047" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M540,809.8047 L540,819.8047 L550,819.8047 L540,809.8047" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.1279" x="305" y="828.2998">PreOrder = EXPIRED; Payment absent.</text><path d="M19,867.1563 L19,958.1563 L469,958.1563 L469,877.1563 L459,867.1563 L19,867.1563" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M459,867.1563 L459,877.1563 L469,877.1563 L459,867.1563" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="429.876" x="25" y="885.6514">End: DRAFT correction, payment subprocess, CANCELLED, or EXPIRED.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="421.9795" x="25" y="902.0029">Reservation stays CONFIRMED until separate cancellation / booked end.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.5513" x="25" y="918.3545">Cancellation and initiation check state as one logical decision:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="403.9331" x="25" y="934.7061">if initiation already won, reconcile instead of claiming no charge exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.8086" x="25" y="951.0576">Deadline trigger/duration remain D-04; no scheduler is selected.</text><rect fill="#DDDDDD" height="45.2188" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="581.2041" x="51.1216" y="1062.2656"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="571.2041" x="56.1216" y="1081.7988">P-PAY proposed; FR-007-FR-008. Valid quote is an input to the separate payment scenario.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdju